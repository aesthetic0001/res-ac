<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensor backend</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">SEEEDUINO CLOUD</p><h1>Sensor backend</h1></div><button class="secondary" id="logout" disabled>Sign out</button></header><p id="message" role="status">Loading devices…</p>
<section aria-labelledby="devices-title"><h2 id="devices-title">Devices</h2><div id="devices" class="devices"></div></section>
<section aria-labelledby="send-title"><h2 id="send-title">Queue a command</h2><p>Commands are delivered to the device's next open poll. Expired commands are not delivered.</p><form id="command-form"><div class="fields"><label>Device<select name="deviceId" id="device-select" required></select></label><label>Command type<input name="type" value="device.ping" required maxlength="64"></label><label>Expires after (seconds)<input name="ttlSeconds" type="number" value="300" min="1" max="86400" required></label></div><label>Payload (JSON object)<textarea name="payload" rows="4" spellcheck="false">{}</textarea></label><button id="send-command" disabled>Queue command</button></form></section>
<section aria-labelledby="history-title"><h2 id="history-title">Recent commands</h2><div class="table-wrap"><table><thead><tr><th>Created</th><th>Device / command</th><th>Status</th><th>Attempts</th><th>Payload / result</th></tr></thead><tbody id="commands"></tbody></table></div></section><footer>Readings and command status refresh every 5 seconds.</footer></main></body></html>
