receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    send_batch_size: 128
    timeout: 1s
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 3s
    sending_queue:
      queue_size: 128
    retry_on_failure:
      max_elapsed_time: 30s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
