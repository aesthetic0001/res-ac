global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ['backend:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
